<div class="auth-page">
  <div class="auth-card" style="max-width:440px">
    <div class="auth-logo">🔐</div>
    <div class="auth-title">Change Password</div>
    <div class="auth-sub">{{ user.name }} &nbsp;·&nbsp; <code>{{ user.regNo }}</code></div>

    <div class="auth-alert error"   ng-if="err">⚠️ {{ err }}</div>
    <div class="auth-alert success" ng-if="msg">✅ {{ msg }}</div>

    <div class="auth-form">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" ng-model="form.oldPass" placeholder="Enter current password" />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" ng-model="form.newPass" placeholder="Min 6 characters" />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" ng-model="form.confirmPass" placeholder="Repeat new password" />
      </div>
      <button class="btn-auth" ng-click="submit()" ng-disabled="saving">
        {{ saving ? 'Saving...' : '🔒 Update Password' }}
      </button>
      <button class="btn-auth" style="background:#7f8c8d;margin-top:8px" ng-click="goBack()">← Back</button>
    </div>
  </div>
</div>
