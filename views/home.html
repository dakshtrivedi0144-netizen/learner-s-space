<div class="home-page">
  <div class="home-hero">
    <div class="hero-icon">🎓</div>
    <h1>BTech Learning Portal</h1>
    <p>Computer Engineering &mdash; Semester III to VIII</p>
    <p class="hero-sub">Select your semester to explore subjects, syllabus, and lab practicals</p>
  </div>

  <div class="sem-grid">
    <a class="sem-card" ng-repeat="sem in semesters" href="#!/semester/{{ sem.id }}">
      <div class="sem-number">Sem {{ sem.id }}</div>
      <div class="sem-label">{{ sem.label }}</div>
      <div class="sem-desc">{{ sem.desc }}</div>
      <div class="sem-arrow">→</div>
    </a>
  </div>
</div>
