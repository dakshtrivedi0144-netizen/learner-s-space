<!DOCTYPE html>
<html lang="en" ng-app="learningPortalApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Learner's Space — Unified Learning Portal</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="#!/home" class="brand">🎓 Learner's Space</a>
    <nav>
      <a href="#!/home" ng-if="getCurrentUser()">Home</a>
      <span class="nav-user" ng-if="getCurrentUser()">
        👤 {{ getCurrentUser().name }}
        <span class="nav-badge">Sem {{ getCurrentUser().semester }}</span>
      </span>
      <a class="nav-logout" ng-if="getCurrentUser()" ng-click="logout()">Logout</a>
    </nav>
  </header>

  <!-- SPA View Outlet -->
  <div class="container">
    <div ng-view></div>
  </div>

  <!-- Firebase SDKs (compat version for non-module usage) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- AngularJS 1.x CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

  <!-- App Module & Config -->
  <script src="app.js?v=3"></script>

  <!-- Services -->
  <script src="services/firebaseService.js?v=1"></script>
  <script src="services/dataService.js?v=2"></script>

  <!-- Controllers -->
  <script src="controllers/authCtrl.js?v=1"></script>
  <script src="controllers/homeCtrl.js?v=1"></script>
  <script src="controllers/dashboardCtrl.js?v=3"></script>
  <script src="controllers/submissionCtrl.js?v=3"></script>
  <script src="controllers/labCtrl.js?v=3"></script>
  <script src="controllers/referencesCtrl.js?v=3"></script>
  <script src="controllers/ccDashboardCtrl.js?v=1"></script>
  <script src="controllers/ccLabCtrl.js?v=1"></script>
  <script src="controllers/dmDashboardCtrl.js?v=2"></script>
  <script src="controllers/dmLabCtrl.js?v=2"></script>

  <!-- Directives -->
  <script src="directives/statusCard.js?v=2"></script>

</body>
</html>
