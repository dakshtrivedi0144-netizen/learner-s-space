<!DOCTYPE html>
<html lang="en" ng-app="learningPortalApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Learner's Space — Unified Learning Portal</title>
  <link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="#!/home" class="brand">🎓 Learner's Space</a>
    <nav>
      <a href="#!/home" ng-if="getCurrentUser()">Home</a>
      <a href="#!/faculty" ng-if="getCurrentUser() && (getCurrentUser().role === 'faculty' || getCurrentUser().role === 'admin')" class="nav-faculty">👩‍🏫 Faculty</a>
      <a href="#!/admin" ng-if="getCurrentUser() && getCurrentUser().role === 'admin'" class="nav-admin">🛡️ Admin</a>
      <a href="#!/change-password" ng-if="getCurrentUser()" class="nav-link" title="Change Password">🔐</a>
      <button class="dark-toggle" ng-click="toggleDark()" title="Toggle Dark Mode">{{ darkMode ? '☀️' : '🌙' }}</button>
      <span class="nav-user" ng-if="getCurrentUser()">
        <span class="role-dot role-{{ getCurrentUser().role || 'student' }}"></span>
        {{ getCurrentUser().name }}
        <span class="nav-badge">Sem {{ getCurrentUser().semester }}</span>
      </span>
      <a class="nav-logout" ng-if="getCurrentUser()" ng-click="logout()">Logout</a>
    </nav>
  </header>

  <!-- SPA View Outlet -->
  <div class="container">
    <div ng-view></div>
  </div>

  <!-- AngularJS 1.x CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

  <!-- App Module & Config -->
  <script src="app.js?v=10"></script>

  <!-- Services -->
  <script src="services/localStorageService.js?v=5"></script>
  <script src="services/dataService.js?v=2"></script>

  <!-- Controllers -->
  <script src="controllers/adminCtrl.js?v=8"></script>
  <script src="controllers/authCtrl.js?v=3"></script>
  <script src="controllers/facultyCtrl.js?v=8"></script>
  <script src="controllers/labManualCtrl.js?v=3"></script>
  <script src="controllers/homeCtrl.js?v=5"></script>
  <script src="controllers/dashboardCtrl.js?v=4"></script>
  <script src="controllers/submissionCtrl.js?v=3"></script>
  <script src="controllers/labCtrl.js?v=7"></script>
  <script src="controllers/referencesCtrl.js?v=4"></script>
  <script src="controllers/ccDashboardCtrl.js?v=2"></script>
  <script src="controllers/ccLabCtrl.js?v=5"></script>
  <script src="controllers/dmDashboardCtrl.js?v=3"></script>
  <script src="controllers/dmLabCtrl.js?v=6"></script>
  <script src="controllers/changePasswordCtrl.js?v=1"></script>

  <!-- Directives -->
  <script src="directives/statusCard.js?v=2"></script>

</body>
</html>
